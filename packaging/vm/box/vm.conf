# Sizing and ports for the two test VMs. Edit on the box (~/ambient-vms/vm.conf), then `vm restart <name>`.
# All ports bind to 127.0.0.1 inside WSL only; the Mac reaches them through an SSH jump via the Windows host.
# If you change an SSH port, change it in packaging/vm/_lib.sh (vm_target) on the Mac too.
WIN_CPUS=4
WIN_MEM=8G
WIN_SSH=2322
WIN_RDP=3390
WIN_VNC=11      # VNC display :11 = TCP 5911
LIN_CPUS=4
LIN_MEM=6G
LIN_SSH=2422
LIN_VNC=12      # VNC display :12 = TCP 5912
DISK_SIZE=64G
# Vendor image sources. The Windows link is Microsoft's Evaluation Center "ISO, Enterprise, 64-bit, en-US" button
# (https://www.microsoft.com/en-us/evalcenter/download-windows-11-enterprise); it changes with each release.
WIN_ISO_URL='https://go.microsoft.com/fwlink/?LinkId=2382600&clcid=0x409&culture=en-us&country=us'
LIN_IMG_URL='https://cloud-images.ubuntu.com/noble/current/noble-server-cloudimg-amd64.img'
